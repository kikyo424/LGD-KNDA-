services:
  - type: web
    name: oled-report-service
    runtime: python
    plan: free
    buildCommand: python -m pip install '.[server]'
    startCommand: python -m uvicorn scripts.report_server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: REPORT_ALLOWED_ORIGINS
        value: https://kikyo424.github.io
