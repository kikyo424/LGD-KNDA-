name: Custom HTML report

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "수집 키워드 (해외 자료는 영문 권장)"
        required: true
        type: string
      date_from:
        description: "시작일 YYYY-MM-DD (2023년 이후)"
        required: false
        type: string
      date_to:
        description: "종료일 YYYY-MM-DD"
        required: false
        type: string
      source:
        description: "자료 유형"
        required: true
        default: all
        type: choice
        options: [all, news, papers]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - name: Collect independent report
        env:
          REPORT_KEYWORD: ${{ inputs.keyword }}
          DATE_FROM: ${{ inputs.date_from }}
          DATE_TO: ${{ inputs.date_to }}
          SOURCE_KIND: ${{ inputs.source }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        shell: bash
        run: |
          args=(--keyword "$REPORT_KEYWORD" --source "$SOURCE_KIND" --report-output reports/custom-report.html)
          if [[ -n "$DATE_FROM" ]]; then args+=(--date-from "$DATE_FROM"); fi
          if [[ -n "$DATE_TO" ]]; then args+=(--date-to "$DATE_TO"); fi
          python scripts/collect.py "${args[@]}"
      - name: Downloadable HTML report
        if: ${{ always() && hashFiles('reports/custom-report.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: custom-html-report-${{ github.run_number }}
          path: reports/custom-report.html
          if-no-files-found: error
          retention-days: 30
      - name: Report download instructions
        if: ${{ always() && hashFiles('reports/custom-report.html') != '' }}
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## HTML 보고서 다운로드
          이 실행 화면 하단 **Artifacts**에서 `custom-html-report` 파일을 다운로드하세요.
          ZIP을 풀고 `custom-report.html`을 브라우저에서 열면 됩니다.
          사이트 데이터는 변경하지 않았습니다. 실패한 수집 경로가 있으면 보고서에 표시됩니다.
          SUMMARY
