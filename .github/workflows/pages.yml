name: Collect and deploy

on:
  push:
    branches: [main]
  schedule:
    # Daily at 09:10 Asia/Seoul (00:10 UTC).
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  TZ: Asia/Seoul

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - name: Collect metadata
        shell: bash
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          echo "COLLECTION_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_ENV"
          python scripts/collect.py
      - name: Verify latest collection summary
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          report = json.loads(Path("src/data/collection_quality.json").read_text(encoding="utf-8"))
          update = report["last_update"]
          assert update["new_count"] == len(update["new_documents"]), "New document count mismatch"
          assert datetime.fromisoformat(update["completed_at"]) >= datetime.fromisoformat(os.environ["COLLECTION_STARTED_AT"]), "Collection summary is stale"
          completed = datetime.fromisoformat(update["completed_at"]).astimezone(timezone(timedelta(hours=9)))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(f"## 최근 업데이트 신규 자료\n\n수집 완료: {completed:%Y-%m-%d %H:%M:%S} (한국 시간)\n\n신규 자료: **{update['new_count']}건**\n\n수집원 오류: {update['source_errors']}건\n")
          PY
      - name: Commit collected metadata
        run: |
          if ! git diff --quiet -- src/data/items.json src/data/collection_quality.json src/data/last_manual_collection.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/items.json src/data/collection_quality.json src/data/last_manual_collection.json
            git commit -m "data: update OLED trend metadata"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              if [[ "$attempt" == "3" ]]; then exit 1; fi
              git fetch origin main
              git rebase origin/main
            done
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:evidence
      - name: Build static site
        run: npm run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
          PUBLIC_REPORT_API_URL: ${{ vars.REPORT_API_URL || 'https://oled-report-service.onrender.com' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Cancel stale Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            // This deployment survived the previous workflow's cancellation.
            // Only clean up this known blocker; leave other deployments alone.
            const params = {
              ...context.repo,
              deploymentId: '7325cbbcd0763429337befba61b680686b151b16',
            };
            const route = '/repos/{owner}/{repo}/pages/deployments/{deploymentId}';
            const terminal = new Set([
              'succeed', 'deployment_cancelled', 'deployment_failed',
              'deployment_perms_error', 'deployment_content_failed', 'deployment_lost',
            ]);
            async function getStatus() {
              try {
                const response = await github.request(`GET ${route}`, params);
                core.info(`Previous Pages deployment: ${response.data.status}`);
                return response.data.status;
              } catch (error) {
                if (error.status === 404) return 'not_found';
                throw error;
              }
            }
            const finished = status => status === 'not_found' || terminal.has(status);
            if (finished(await getStatus())) return;
            await github.request(`POST ${route}/cancel`, params);
            for (let attempt = 0; attempt < 12; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              if (finished(await getStatus())) return;
            }
            throw new Error('GitHub Pages still reports the previous deployment as active after cancellation. Retry this workflow once GitHub finishes cancelling it.');
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

