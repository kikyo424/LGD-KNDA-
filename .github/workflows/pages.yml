name: Collect and deploy

on:
  push:
    branches: [main]
  schedule:
    # Daily at 08:00 Asia/Seoul (23:00 UTC on the previous day).
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - name: Collect metadata
        shell: bash
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/collect.py
      - name: Commit collected metadata
        run: |
          if ! git diff --quiet -- src/data/items.json src/data/collection_quality.json src/data/last_manual_collection.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/items.json src/data/collection_quality.json src/data/last_manual_collection.json
            git commit -m "data: update OLED trend metadata"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:evidence
      - name: Build static site
        run: npm run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
          PUBLIC_REPORT_API_URL: ${{ vars.REPORT_API_URL || 'https://oled-report-service.onrender.com' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

