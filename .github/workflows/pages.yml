name: Collect and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:
    inputs:
      keyword:
        description: "맞춤 수집 키워드 (비우면 기본 OLED 수집)"
        required: false
        type: string
      date_from:
        description: "시작일 YYYY-MM-DD"
        required: false
        type: string
      date_to:
        description: "종료일 YYYY-MM-DD"
        required: false
        type: string
      source:
        description: "수집 자료 유형"
        required: true
        default: all
        type: choice
        options:
          - all
          - news
          - papers

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - name: Collect metadata
        shell: bash
        env:
          MANUAL_KEYWORD: ${{ inputs.keyword }}
          DATE_FROM: ${{ inputs.date_from }}
          DATE_TO: ${{ inputs.date_to }}
          SOURCE_KIND: ${{ inputs.source }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          args=()
          if [[ -n "$MANUAL_KEYWORD" ]]; then args+=(--keyword "$MANUAL_KEYWORD"); fi
          if [[ -n "$DATE_FROM" ]]; then args+=(--date-from "$DATE_FROM"); fi
          if [[ -n "$DATE_TO" ]]; then args+=(--date-to "$DATE_TO"); fi
          if [[ -n "$SOURCE_KIND" ]]; then args+=(--source "$SOURCE_KIND"); fi
          python scripts/collect.py "${args[@]}"
      - name: Commit collected metadata
        run: |
          if ! git diff --quiet -- src/data/items.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/items.json
            git commit -m "data: update OLED trend metadata"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npm run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

